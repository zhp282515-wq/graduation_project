<!doctype html>
<html lang="zh-CN" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2eee4" />
    <meta name="description" content="饭饭 · 江西师范大学校园智能体：问学、典藏、记忆与知识星图。" />
    <title>饭饭</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=seal" />
    <script>
      // 主题在首帧之前定下来，避免纸张/星夜切换时闪一下白。
      (function () {
        try {
          var saved = localStorage.getItem('jxnu.theme');
          var theme = saved === 'night' || saved === 'paper'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'paper');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>星野台需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
