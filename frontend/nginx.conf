server {
    listen 80;
    server_name _;
    client_max_body_size 52m;

    location ~ ^/admin/(usage|logs)/?$ {
        auth_request /_usage_access;
        error_page 401 = @usage_login;
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location @usage_login {
        absolute_redirect off;
        return 302 /login?redirect=$uri;
    }

    location = /_usage_access {
        internal;
        proxy_pass http://backend:8002/api/admin/usage/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location /api/ {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /uploads/ {
        proxy_pass http://backend:8002;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
